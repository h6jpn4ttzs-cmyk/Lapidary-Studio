<style>
:root{color-scheme:dark;--ink:#eaf6ff;--mute:#9fb4ff;--acc:#22f3ff;--panel:rgba(10,8,34,.74);--line:rgba(255,255,255,.15);--card:#0b0d24;

canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#cut2{pointer-events:none}
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.money{font-size:13px;color:var(--mute)}.money b{color:var(--ink);font-size:18px}
.gauge{width:56%;max-width:260px}
.lab{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:4px}
.lab b{color:var(--ink);font-size:20px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:5px;transition:width .12s}
.hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);text-align:center;font-size:14px;color:var(--mute);pointer-events:none;line-height:1.6;padding:0 16px;text-shadow:0 1px 6px #000}

.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;align-items:center}

button.on{background:var(--acc);color:#06141f;border-color:var(--acc)}
button.gold{background:#ff3df0;color:#14052a;border-color:#ff3df0}

button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#act{flex:1;max-width:170px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{min-height:38px;padding:6px 11px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}

#photoImg{width:100%;border-radius:12px;display:block}
.ov{perspective:900px}
.card,.shop{animation:pop .5s cubic-bezier(.2,.9,.3,1.15) backwards;transform-origin:50% 100%}
@keyframes pop{from{opacity:0;transform:rotateX(-75deg) translateY(50px) scale(.9)}to{opacity:1;transform:none}}
button{transition:transform .12s,box-shadow .12s,background .2s;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.bot{perspective:600px}
.bot button{animation:bin .7s cubic-bezier(.2,.9,.3,1.2) backwards}
.bot button:nth-child(2){animation-delay:.07s}.bot button:nth-child(3){animation-delay:.14s}.bot button:nth-child(4){animation-delay:.21s}
@keyframes bin{from{opacity:0;transform:rotateX(70deg) translateY(40px)}to{opacity:1;transform:none}}

.grade{animation:gr 1s cubic-bezier(.2,.9,.3,1.3) .15s backwards}
@keyframes gr{from{opacity:0;transform:perspective(500px) rotateY(540deg) scale(.3)}to{opacity:1;transform:none}}
.row.ani{animation:rowin .45s cubic-bezier(.2,.9,.3,1.1) backwards;transform-origin:50% 0}
@keyframes rowin{from{opacity:0;transform:perspective(500px) rotateX(-70deg)}to{opacity:1;transform:none}}
.shop{perspective:700px}
.sc{width:34px;height:34px;perspective:240px}
.cube{position:relative;width:34px;height:34px;transform-style:preserve-3d;animation:cs 8s linear infinite}
.cube i{position:absolute;inset:0;border:1px solid rgba(255,255,255,.55);background:linear-gradient(135deg,rgba(34,243,255,.6),rgba(160,120,255,.25))}

@keyframes cs{to{transform:rotateX(360deg) rotateY(360deg)}}
.tg{position:relative;height:18px;border-radius:9px;background:rgba(255,255,255,.12);margin:14px 0;overflow:hidden}
.tg .zone{position:absolute;top:0;bottom:0;background:rgba(34,243,255,.5)}

.bar{height:12px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(34,243,255,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.7);position:relative}
.bar::after{content:"";position:absolute;inset:0;border-radius:7px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.45) calc(10% - 1px) 10%);pointer-events:none}
.bar i{background:linear-gradient(90deg,#3a1a9a,#22f3ff,#e4fdff,#22f3ff,#7a3dff);background-size:200% 100%;box-shadow:0 0 12px rgba(34,243,255,.8)}

#dust i{position:absolute;bottom:-10px;width:var(--s);height:var(--s);background:radial-gradient(circle,#fff 0,rgba(190,250,255,.8) 35%,transparent 70%);border-radius:50%;opacity:0;animation:dust var(--d) linear var(--w) infinite}
@keyframes dust{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.7}85%{opacity:.35}100%{transform:translate(var(--x),-108vh) scale(1);opacity:0}}
/* HUD glass with faceted edge */
.money,.gauge{background:var(--glass)!important;border:1px solid transparent!important;background-clip:padding-box;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 1px rgba(190,250,255,.12),inset 0 1px 0 rgba(255,255,255,.2)!important}
.money::before,.gauge::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.money b{background:linear-gradient(180deg,#e4fdff,var(--gold2) 40%,var(--gold3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-family:"Cormorant Garamond",serif;font-size:24px;letter-spacing:.02em;filter:drop-shadow(0 1px 6px rgba(255,61,240,.45))}
.lab b{font-family:"Cormorant Garamond",serif;font-size:26px;color:#fff;text-shadow:0 0 14px rgba(34,243,255,.7)}
.bar{height:12px!important;background:rgba(0,0,0,.45)!important;box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1)}
.bar i{background:linear-gradient(90deg,#14c8e6,#22f3ff,#d6fcff,#22f3ff,#14c8e6)!important;background-size:240% 100%!important;box-shadow:0 0 14px rgba(34,243,255,.85)}
/* buttons: cut-gem look */
button{border-radius:16px!important;background:var(--glass);letter-spacing:.03em;border:1px solid rgba(190,250,255,.28)!important;box-shadow:0 5px 0 rgba(0,0,0,.5),0 10px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -10px 18px rgba(0,0,0,.25)}
button.on{background:linear-gradient(180deg,#8afaff,#22d9f0 55%,#1aa8d8)!important;box-shadow:0 5px 0 #0b4a8a,0 0 26px rgba(34,243,255,.55),inset 0 1px 0 rgba(255,255,255,.6)!important}
button.gold{background:linear-gradient(180deg,#7ef6ff,#ff3df0 55%,#d62fc8)!important;box-shadow:0 5px 0 #5a1a9a,0 0 26px rgba(255,61,240,.5),inset 0 1px 0 rgba(255,255,255,.7)!important}
button:active{box-shadow:0 1px 0 rgba(0,0,0,.5)!important}
.bot{background:linear-gradient(0deg,rgba(4,4,16,.85),transparent);padding-top:26px}
/* modals: velvet case */
.ov{background:radial-gradient(80% 60% at 50% 40%,rgba(30,24,96,.55),rgba(3,4,14,.88))!important;backdrop-filter:blur(7px)}
.card,.shop{background:var(--glass)!important;border:1px solid transparent!important;box-shadow:0 30px 70px rgba(0,0,0,.7),0 0 60px rgba(34,243,255,.12),inset 0 1px 0 rgba(255,255,255,.18)!important;position:relative}
.card .grade{text-shadow:0 0 30px rgba(255,61,240,.7),0 4px 0 rgba(0,0,0,.35);font-family:"Cormorant Garamond",serif;font-size:72px}
.shop .hd b{font-family:"Shippori Mincho",serif;font-size:20px;background:linear-gradient(90deg,var(--gold2),#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tabs button{border-radius:999px!important;padding:6px 14px!important}
.row{margin:6px 0;padding:12px 12px!important;border:1px solid rgba(190,250,255,.16)!important;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.015))}
.row:active{background:rgba(34,243,255,.1)}
.row b{color:#fff}
input{border-radius:14px;background:rgba(0,0,0,.4);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold2),var(--gold3));border-radius:6px}
/* side buttons float like jewels */
.qbtn{background:var(--glass)!important;border:1px solid rgba(190,250,255,.4)!important;box-shadow:0 8px 22px rgba(0,0,0,.55),0 0 18px rgba(190,250,255,.15),inset 0 1px 0 rgba(255,255,255,.3)!important}
.toast{background:var(--glass)!important;border:1px solid rgba(190,250,255,.45)!important;box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 24px rgba(255,61,240,.25)!important}
.hint{font-family:"Shippori Mincho",serif;letter-spacing:.06em}
/* cards in index / invest */
.cx-card,.iv-card,.iv-sum div{border-color:rgba(190,250,255,.25)!important;background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.015))!important;box-shadow:0 8px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15)}
@media (prefers-reduced-motion:reduce){#dust{display:none}}
</style>

<style id="neon2">/* ===== ネオン出現アニメーション ===== */
.card,.shop{animation:nboot .8s cubic-bezier(.2,.8,.2,1) backwards;transform-origin:50% 50%}
@keyframes nboot{
 0%{opacity:0;clip-path:inset(49.6% -70px 49.6% -70px);transform:scaleX(.5);filter:brightness(3) drop-shadow(0 0 20px #22f3ff)}
 16%{opacity:1;clip-path:inset(49.2% -70px 49.2% -70px);transform:scaleX(1);filter:brightness(2.4) drop-shadow(0 0 26px #22f3ff)}
 52%{clip-path:inset(-70px);transform:none;filter:brightness(1.9) drop-shadow(0 0 26px #ff3df0)}
 60%{opacity:.55}64%{opacity:1}70%{opacity:.7;transform:translateX(4px) skewX(-2deg)}74%{opacity:1;transform:translateX(-2px)}78%{transform:none}
 100%{clip-path:inset(-70px);filter:none}}
.card>:not(h2):not(canvas),.shop>*{animation:nin .55s cubic-bezier(.2,.8,.3,1) backwards}
.card>:nth-child(2),.shop>:nth-child(2){animation-delay:.32s}.card>:nth-child(3),.shop>:nth-child(3){animation-delay:.38s}.card>:nth-child(4),.shop>:nth-child(4){animation-delay:.44s}
.card>:nth-child(5),.shop>:nth-child(5){animation-delay:.5s}.card>:nth-child(6),.shop>:nth-child(6){animation-delay:.56s}.card>:nth-child(n+7),.shop>:nth-child(n+7){animation-delay:.62s}
@keyframes nin{0%{opacity:0;transform:translateX(-26px) skewX(-14deg);filter:blur(5px) brightness(2.6) drop-shadow(0 0 10px #22f3ff)}55%{opacity:1;transform:translateX(5px) skewX(3deg);filter:brightness(1.7) drop-shadow(0 0 10px #ff3df0)}100%{opacity:1;transform:none;filter:none}}
@keyframes rowin{0%{opacity:0;transform:translateX(-30px) skewX(-14deg);filter:blur(4px) brightness(2.6) drop-shadow(0 0 10px #22f3ff)}60%{opacity:1;transform:translateX(5px) skewX(3deg);filter:brightness(1.6)}100%{opacity:1;transform:none;filter:none}}
@keyframes bin{0%{opacity:0;transform:translateY(46px) scale(.6);filter:brightness(3.2) blur(3px)}50%{opacity:1;transform:translateY(-5px) scale(1.08);filter:brightness(1.9) drop-shadow(0 0 14px #ff3df0)}70%{transform:translateY(1px) scale(.98)}100%{opacity:1;transform:none;filter:none}}
@keyframes dropin{0%{opacity:0;transform:translateY(-46px) scale(.8);filter:brightness(3) blur(3px)}45%{opacity:1;transform:translateY(4px) scale(1.05);filter:brightness(1.9) drop-shadow(0 0 16px #22f3ff)}55%{opacity:.6}62%{opacity:1}100%{opacity:1;transform:none;filter:none}}
@keyframes hin{0%{opacity:0;transform:translateY(8px);letter-spacing:.34em;filter:blur(4px) brightness(2.6)}100%{opacity:1;transform:none;filter:none}}
@keyframes h2in{0%{opacity:0;letter-spacing:.5em;filter:blur(8px) brightness(3)}60%{opacity:1;filter:brightness(1.6) drop-shadow(0 0 14px #ff3df0)}100%{opacity:1;filter:drop-shadow(0 0 8px rgba(34,243,255,.8))}}
@keyframes gr{0%{opacity:0;transform:perspective(500px) rotateY(540deg) scale(.2);filter:brightness(4) blur(6px)}60%{opacity:1;filter:brightness(2)}100%{opacity:1;transform:none}}
@keyframes ivin{0%{opacity:0;transform:translateX(-26px) skewX(-12deg);filter:brightness(2.6) blur(3px)}100%{opacity:1;transform:none;filter:none}}
.ov.show::after{content:"";position:fixed;left:0;right:0;top:0;height:3px;z-index:3;pointer-events:none;background:linear-gradient(90deg,transparent,#22f3ff 25%,#ff3df0 75%,transparent);box-shadow:0 0 18px #22f3ff,0 0 40px #ff3df0;animation:nscan .75s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes nscan{0%{top:0;opacity:1}85%{opacity:1}100%{top:100%;opacity:0}}
.ov.show{animation:ovin2 .4s ease-out}

.vig::before{animation:vb 1.3s steps(1,end) backwards}

/* ===== 指タッチのネオンリング ===== */
.tch{position:fixed;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;pointer-events:none;z-index:5;display:none;border:2px solid rgba(34,243,255,.95);box-shadow:0 0 14px #22f3ff,0 0 32px rgba(34,243,255,.5),inset 0 0 12px rgba(34,243,255,.5)}
.tch::before{content:"";position:absolute;inset:8px;border-radius:50%;border:2px dashed #ff3df0;box-shadow:0 0 10px #ff3df0;animation:tchr 1.3s linear infinite}
.tch::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 26px #22f3ff}
.tch.on{display:block;animation:tchp .45s ease-out}
@keyframes tchr{to{transform:rotate(360deg)}}@keyframes tchp{from{transform:scale(2);opacity:0}to{transform:none;opacity:1}}
body.focus .tch{display:none!important}

.rbmoney{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin:2px 2px 8px}.rbmoney b{display:block;margin-top:2px;font:700 14px Orbitron,sans-serif;color:#fff}.rbmoney span:last-child{text-align:right}
.rbtrk{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin:6px 2px 14px}
.rbtrk i{height:6px;border-radius:2px;background:rgba(255,255,255,.1)}
.rbtrk i.d{background:linear-gradient(180deg,#7ef6ff,#8a5cff);box-shadow:0 0 6px rgba(34,243,255,.7)}
.rbtrk i.c{background:#ff3df0;box-shadow:0 0 8px #ff3df0;animation:rbBlink 1.2s ease-in-out infinite}
.rbcmp{display:flex;align-items:center;gap:6px;margin-bottom:12px}.rbcmp.one{justify-content:center}
.rbp{flex:1;border-radius:14px;padding:11px 8px 10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
.rbcmp.one .rbp{flex:0 0 62%}
.rbp small{display:block;font-size:11px;color:var(--mute);letter-spacing:.04em}
.rbp b{display:block;margin-top:4px;font:800 24px Orbitron,sans-serif;color:#fff}
.rbp.nxt{border-color:rgba(255,61,240,.7);background:linear-gradient(160deg,rgba(255,61,240,.18),rgba(138,92,255,.12));box-shadow:0 0 22px -6px #ff3df0}
.rbp.nxt b{background:linear-gradient(90deg,#ffd84a,#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent}
.rbp.now{border-color:rgba(34,243,255,.35)}
.rbar{width:26px;flex:0 0 26px}.rbar svg{width:26px;height:26px;fill:none;stroke:#7ef6ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #22f3ff);animation:rbNudge 1.4s ease-in-out infinite}
.rbun{text-align:left;border-radius:14px;padding:10px 12px 8px;margin-bottom:14px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.22)}
.rbun h4{margin:0 0 8px;font:700 10px Orbitron,sans-serif;letter-spacing:.32em;color:#7ef6ff}
.rbg{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;--k:#7ef6ff}
.rbg.b{--k:#c58bff}.rbg.c{--k:#ffd84a}.rbg.d{--k:#ff7ad9}
.rbg em{flex:0 0 66px;font-style:normal;font-size:10px;font-weight:700;padding-top:5px;color:var(--k);letter-spacing:.04em}
.rbg div{display:flex;flex-wrap:wrap;gap:5px}
.rbg span{font-size:12px;line-height:1;padding:6px 9px;border-radius:999px;color:#fff;border:1px solid var(--k);background:rgba(255,255,255,.05);box-shadow:0 0 10px -4px var(--k)}
.rbnone{font-size:12px;color:var(--mute);padding:2px 0 6px}
.rbgo{position:relative;overflow:hidden;width:100%;min-height:58px;border:0;border-radius:16px;color:#06141f;background:linear-gradient(100deg,#22f3ff,#8a5cff 55%,#ff3df0);box-shadow:0 0 26px -4px rgba(138,92,255,.9),inset 0 1px 0 rgba(255,255,255,.5);font:800 15px Orbitron,"Zen Maru Gothic",sans-serif;letter-spacing:.08em}
.rbgo span{position:relative;z-index:1}
.rbgo:before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:rbSheen 2.6s ease-in-out infinite}
.rbgo.arm{background:linear-gradient(100deg,#ffd84a,#ff7ad9);animation:rbArm .5s ease-in-out infinite alternate}
.rbgo:disabled{opacity:1;color:#9fb4ff;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);letter-spacing:.04em}
.rbgo:disabled:before{display:none}
.rbnote{margin:10px 2px 0;font-size:11.5px;line-height:1.6;color:var(--mute)}
.rbcl{width:100%;margin-top:10px}
@keyframes rbFill{from{stroke-dashoffset:var(--c)}}
@keyframes rbSpin{to{transform:rotate(360deg)}}
@keyframes rbGlow{50%{filter:drop-shadow(0 0 18px #ff3df0) drop-shadow(0 0 8px #22f3ff)}}
@keyframes rbBlink{50%{opacity:.35}}
@keyframes rbNudge{50%{transform:translateX(4px)}}
@keyframes rbSheen{0%{left:-60%}55%,100%{left:130%}}
@keyframes rbArm{to{box-shadow:0 0 34px 0 rgba(255,216,74,.9)}}
body.lite .rbhero circle,body.lite .rbgo:before,body.lite .rbar svg,body.lite .rbtrk i.c,body.lite .rbgo.arm{animation:none!important}

function size(){const dpr=Math.min(window.devicePixelRatio||1,2),sc=Math.max(.6,Math.min(1.05,.8*dpr)),w=Math.max(1,window.innerWidth),h=Math.max(1,window.innerHeight);cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);W=cv.width;H=cv.height;U=min(W,H)/100}
function setW(name){nm=name;size();sd=7;const f=DEF[name]||DEF['工房の夜'];try{cur=f()}catch(e){cur=[];console.error(e)}tt=0;draw(0,0)}
function draw(t,dt){X.globalCompositeOperation='source-over';X.globalAlpha=1;X.setLineDash([]);X.lineCap='butt';for(const l of cur){try{l.d(t,dt)}catch(e){if(!window.__e)console.error("BGX",e.message)}}X.globalAlpha=1;X.globalCompositeOperation='source-over'}
const RMo=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(now){requestAnimationFrame(loop);if(LITE||document.hidden||(document.body&&document.body.classList.contains('focus')))return;const iv=1000/(RMo?2:fps);if(now-lt<iv)return;const dt=Math.min(.1,(now-lt)/1000);lt=now;tt+=dt;draw(tt,dt)}
requestAnimationFrame(loop);
window.addEventListener('resize',()=>{if(nm){clearTimeout(hold);hold=setTimeout(()=>setW(nm),150)}});
return{tick:n=>{for(let i=0;i<n;i++){tt+=.033;draw(tt,.033)}},set:setW,fps:v=>{fps=v},lite:v=>{LITE=!!v},cv,names:()=>Object.keys(DEF),snap:()=>cv};
})();
